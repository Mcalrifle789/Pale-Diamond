[package]
name = "pale-diamond-caustics"
version = "1.0.0"
edition = "2021"
description = "Caustics light field for the Pale Diamond hero, compiled to WebAssembly."

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
